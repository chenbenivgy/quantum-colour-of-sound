  <line x1="8" y1="30" x2="142" y2="30" stroke="#334455" stroke-width="0.5"/>

  <!-- row 1: transport (red frame) -->
  <rect x="7" y="34" width="136" height="46" rx="2" fill="none" stroke="#d9534f" stroke-width="0.6" stroke-opacity="0.8"/>
  <text x="30" y="41" fill="#d9534f" font-family="monospace" font-size="4.5" text-anchor="middle">ON</text>
  <text x="60" y="44" fill="#cc6666" font-family="monospace" font-size="2.8" text-anchor="middle">REC</text>
  <text x="70" y="44" fill="#cccc66" font-family="monospace" font-size="2.8" text-anchor="middle">CMP</text>
  <text x="80" y="44" fill="#66cc66" font-family="monospace" font-size="2.8" text-anchor="middle">PLAY</text>
  <text x="90" y="44" fill="#cc4444" font-family="monospace" font-size="2.8" text-anchor="middle">ERR</text>
  <text x="84" y="63" fill="#d9534f" font-family="monospace" font-size="2.8" text-anchor="start">past</text>
  <text x="84" y="76" fill="#d9534f" font-family="monospace" font-size="2.8" text-anchor="start">future</text>
  <text x="120" y="41" fill="#d9534f" font-family="monospace" font-size="4.5" text-anchor="middle">ENGINE</text>
