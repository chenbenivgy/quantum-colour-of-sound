  <rect x="7" y="134" width="136" height="46" rx="2" fill="none" stroke="#f2c94c" stroke-width="0.6" stroke-opacity="0.8"/>
  <text x="30" y="141" fill="#f2c94c" font-family="monospace" font-size="4.5" text-anchor="middle">gx</text>
  <text x="75" y="141" fill="#f2c94c" font-family="monospace" font-size="4.5" text-anchor="middle">gz</text>
  <text x="120" y="141" fill="#f2c94c" font-family="monospace" font-size="4.5" text-anchor="middle">COUPLING</text>
  <text x="129" y="151" fill="#a8903a" font-family="monospace" font-size="2.8" text-anchor="start">auto</text>
  <text x="129" y="164" fill="#a8903a" font-family="monospace" font-size="2.8" text-anchor="start">knobs</text>

