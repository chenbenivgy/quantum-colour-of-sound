  <text x="75" y="312" fill="#dddddd" font-family="monospace" font-size="4.5" text-anchor="middle">ON CV</text>
  <text x="120" y="312" fill="#dddddd" font-family="monospace" font-size="4.5" text-anchor="middle">OUT</text>
