  <rect x="7" y="84" width="136" height="46" rx="2" fill="none" stroke="#5bc8f5" stroke-width="0.6" stroke-opacity="0.8"/>
  <text x="30" y="92" fill="#5bc8f5" font-family="monospace" font-size="4.5" text-anchor="middle">TS1</text>
  <text x="75" y="95" fill="#5bc8f5" font-family="monospace" font-size="4.5" text-anchor="middle">VOLUME</text>
  <text x="120" y="92" fill="#5bc8f5" font-family="monospace" font-size="4.5" text-anchor="middle">RENDER</text>
  <text x="120" y="126" fill="#4a8aa8" font-family="monospace" font-size="2.4" text-anchor="middle">undep dep0 dep1 cFB pink</text>

